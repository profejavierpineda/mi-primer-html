<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos - Curso de Programación</title>
    <!-- Carga de Tailwind CSS para un diseño moderno y fluido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-slate-100">

    <!-- Tarjeta central -->
    <main class="max-w-md w-full bg-slate-800/80 backdrop-blur-lg rounded-2xl p-8 shadow-2xl border border-slate-700/50 text-center transition-all duration-300 hover:shadow-indigo-500/10">
        
        <!-- Contenedor del Título -->
        <div class="mb-4">
            <h1 class="text-4xl sm:text-5xl font-extrabold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent tracking-tight">
                Bienvenidos
            </h1>
        </div>

        <!-- Contenedor del Párrafo -->
        <div>
            <p class="text-lg sm:text-xl text-slate-300 font-medium tracking-wide">
                Curso de programación
            </p>
        </div>

        <!-- Un pequeño adorno estético -->
        <div class="mt-8 pt-6 border-t border-slate-700/60 flex justify-center items-center gap-2 text-xs text-slate-400">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Clase en vivo disponible</span>
        </div>

    </main>

</body>
</html>
